[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "reachy_japanese_realtime"
version = "0.1.0"
description = "Japanese-first OpenAI Realtime voice and motion app for Reachy Mini Wireless"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "openai>=2.26.0",
    "reachy-mini>=1.8.0",
]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
reachy_japanese_realtime = "reachy_japanese_realtime.main:ReachyJapaneseRealtime"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
reachy_japanese_realtime = ["**/*"] # Also include all non-.py files

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
